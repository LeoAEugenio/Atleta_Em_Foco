services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atleta_em_foco
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atleta_em_foco_demo}
    volumes:
      - atleta_em_foco_pgdata:/var/lib/postgresql/data
      - ./database/001_schema_postgresql.sql:/docker-entrypoint-initdb.d/001_schema_postgresql.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d atleta_em_foco"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./AtletaEmFoco.Api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=atleta_em_foco;Username=postgres;Password=${POSTGRES_PASSWORD:-atleta_em_foco_demo}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  atleta_em_foco_pgdata:
